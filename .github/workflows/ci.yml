name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,prepare,diagnostics]'
      - run: pytest

  r-bayeslogit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: r-lib/actions/setup-r@v2
      - run: python -m pip install -e '.[test,diagnostics]'
      - name: Install BayesLogit
        shell: Rscript {0}
        run: |
          dir.create(path.expand("~/Rlibs"), showWarnings = FALSE)
          install.packages(
            "BayesLogit",
            lib = path.expand("~/Rlibs"),
            repos = "https://cloud.r-project.org"
          )
      - name: Exact Pólya-Gamma, checkpoint, resume and diagnostics tests
        run: >-
          pytest -q
          code/tests/test_polya_gamma_binary.py
          code/tests/test_shared_gp_checkpoint.py
          code/tests/test_compact_storage.py
          code/tests/test_compact_diagnostics.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: spadag --help
      - run: spadag-prepare --help
      - run: spadag-evaluate --help
      - name: Wheel content policy
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          forbidden = ("tests/", "private/", "priv/", "artifacts/", "Research/")
          assert not any(any(part in name for part in forbidden) for name in names)
          assert "spadag/r_bridges/pgdraw_bridge_binary.R" in names
          PY
